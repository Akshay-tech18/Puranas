<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Festival Memory Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            color: #f0e68c;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-style: italic;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .info-item {
            color: #fff;
            font-size: 1.1em;
            font-weight: bold;
        }

        .info-item span {
            color: #ffd700;
            font-size: 1.3em;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 3/4;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            opacity: 0.7;
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: rotateY(180deg);
            padding: 20px;
        }

        .card-back {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: 3px solid #fff;
        }

        .card-back::before {
            content: '🪄';
            font-size: 2.5em;
        }

        .reset-btn {
            display: block;
            margin: 0 auto;
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .story-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .story-modal.active {
            display: flex;
        }

        .story-content {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .story-icon {
            font-size: 4em;
            text-align: center;
            margin-bottom: 20px;
        }

        .story-title {
            color: #764ba2;
            font-size: 2em;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #f5576c;
            padding-bottom: 10px;
        }

        .story-text {
            color: #333;
            line-height: 1.8;
            font-size: 1.1em;
            text-align: justify;
        }

        .close-story {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f5576c;
            color: #fff;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .close-story:hover {
            transform: rotate(90deg);
        }

        .win-message {
            display: none;
            text-align: center;
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .win-message.active {
            display: block;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .win-message h2 {
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .win-message p {
            color: #666;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            h1 {
                font-size: 1.8em;
            }

            .card-face {
                font-size: 2em;
            }

            .story-content {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            .game-board {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🪔 Indian Facts Memory Game 🪔</h1>
        <p class="subtitle">Match the pairs to learn stories!</p>
        
        <div class="game-info">
            <div class="info-item">Moves: <span id="moves">0</span></div>
            <div class="info-item">Matches: <span id="matches">0</span>/8</div>
            <div class="info-item">Time: <span id="time">0:00</span></div>
        </div>

        <div class="win-message" id="winMessage">
            <h2>🎉 Congratulations! 🎉</h2>
            <p>You've discovered all the festival stories!</p>
        </div>

        <div class="game-board" id="gameBoard"></div>
        
        <button class="reset-btn" onclick="resetGame()">New Game</button>
    </div>

    <div class="story-modal" id="storyModal">
        <div class="story-content">
            <button class="close-story" onclick="closeStory()">×</button>
            <div class="story-icon" id="storyIcon"></div>
            <h2 class="story-title" id="storyTitle"></h2>
            <p class="story-text" id="storyText"></p>
        </div>
    </div>

    <script>
        const festivals = [
            {
                icon: '🌸',
                name: 'Kolam',
                story: 'Kolam is a traditional South Indian floor art made using rice flour, drawn daily at the entrance of homes to invite prosperity and positive energy. It is believed to nourish small creatures like ants and symbolize harmony, cleanliness, and auspicious beginnings'
            },
            {
                icon: '🪙',
                name: 'Throwing Coins into Rivers',
                story: 'Ancient coins were made of copper, a metal that naturally purifies water and kills microbes, making drinking water safer. Over time, this practical habit evolved into a ritual symbolizing good luck and prosperity.'
            },
            {
                icon: '🍋',
                name: 'Keeping a Lemon and Green Chilies Outside Shops',
                story: 'The lemon–chili hanging was believed to offer protection from negative energy and evil influences. Its acidic lemon and strong chili smell also naturally kept insects away from shop entrances, making it both a spiritual symbol and a practical tool in earlier times.'
            },
            {
                icon: '🧹',
                name: 'Not Sweeping After Sunset',
                story: 'People avoided sweeping after sunset to prevent such accidental losses, which were harder to notice in dim oil-lamp lighting. Over time, this practical caution turned into a traditional belief that sweeping at night could drive away wealth and good fortune.'
            },
            {
                icon: '🚶🏻',
                name: 'The Warkari Dindi',
                story: ' The Warkari Dindi is a devotional procession in Maharashtra where groups of Warkaris walk together to Pandharpur during Ashadhi Ekadashi. They sing abhangas, play traditional instruments, and follow a disciplined, spiritual routine. The dindi highlights devotion, equality, and community service.'
            },
            {
                icon: '⭕',
                name: 'Circumambulation Around Tulsi Plant',
                story: 'Circumambulating the Tulsi plant is believed to purify the mind and bring spiritual upliftment. Tulsi is considered sacred and is said to radiate positive energy around the home. Walking around it daily is also seen as a way to express gratitude and seek blessings for health and prosperity.'

            },
            {
                icon: '🔥',
                name: 'Dhoop Ritual (Burning Dried Herbs)',
                story: 'The Dhoop ritual involves burning dried herbs or resins to create fragrant smoke that purifies the surroundings. Traditionally, it was used to repel insects and cleanse the air. It also helps create a peaceful, spiritual atmosphere during prayers.'
            },
            {
                icon: '👕',
                name: 'Wearing New Clothes on Eid',
                story: 'Wearing new clothes on Eid symbolizes renewal, gratitude, and joy after completing the month of Ramadan. It reflects purity and starting fresh on a spiritually significant day. The tradition also emphasizes sharing happiness and presenting oneself with dignity during prayers and celebrations.'
            }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let gameStarted = false;
        let startTime;
        let timerInterval;

        function initGame() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            cards = [...festivals, ...festivals]
                .sort(() => Math.random() - 0.5)
                .map((festival, index) => ({
                    ...festival,
                    id: index,
                    matched: false
                }));

            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.id = card.id;
                cardElement.innerHTML = `
                    <div class="card-face card-front">${card.icon}</div>
                    <div class="card-face card-back"></div>
                `;
                cardElement.addEventListener('click', () => flipCard(card.id));
                gameBoard.appendChild(cardElement);
            });

            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            gameStarted = false;
            document.getElementById('moves').textContent = '0';
            document.getElementById('matches').textContent = '0/8';
            document.getElementById('time').textContent = '0:00';
            document.getElementById('winMessage').classList.remove('active');
            clearInterval(timerInterval);
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('time').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function flipCard(id) {
            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }

            if (flippedCards.length === 2) return;
            
            const card = cards.find(c => c.id === id);
            if (card.matched || flippedCards.includes(id)) return;

            const cardElement = document.querySelector(`[data-id="${id}"]`);
            cardElement.classList.add('flipped');
            flippedCards.push(id);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                setTimeout(checkMatch, 800);
            }
        }

        function checkMatch() {
            const [id1, id2] = flippedCards;
            const card1 = cards.find(c => c.id === id1);
            const card2 = cards.find(c => c.id === id2);

            if (card1.name === card2.name) {
                card1.matched = true;
                card2.matched = true;
                document.querySelector(`[data-id="${id1}"]`).classList.add('matched');
                document.querySelector(`[data-id="${id2}"]`).classList.add('matched');
                
                matchedPairs++;
                document.getElementById('matches').textContent = `${matchedPairs}/8`;
                
                setTimeout(() => showStory(card1), 500);
                
                if (matchedPairs === 8) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        document.getElementById('winMessage').classList.add('active');
                    }, 1000);
                }
            } else {
                document.querySelector(`[data-id="${id1}"]`).classList.remove('flipped');
                document.querySelector(`[data-id="${id2}"]`).classList.remove('flipped');
            }

            flippedCards = [];
        }

        function showStory(festival) {
            document.getElementById('storyIcon').textContent = festival.icon;
            document.getElementById('storyTitle').textContent = festival.name;
            document.getElementById('storyText').textContent = festival.story;
            document.getElementById('storyModal').classList.add('active');
        }

        function closeStory() {
            document.getElementById('storyModal').classList.remove('active');
        }

        function resetGame() {
            clearInterval(timerInterval);
            initGame();
        }

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
